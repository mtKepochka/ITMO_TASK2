name: ticket-automation

x-ticket-service: &ticket-service
  image: ${TICKET_IMAGE:-ticket-automation}:${TICKET_TAG:?run through Makefile}
  build:
    context: .
    args:
      APP_VERSION: ${TICKET_VERSION:?run through Makefile}
      VCS_REF: ${TICKET_REVISION:-unknown}
  volumes:
    - ticket-runtime:/runtime

services:
  demo:
    <<: *ticket-service
    command: ["demo"]

  api:
    <<: *ticket-service
    entrypoint: ["ticket-api"]
    environment:
      TICKET_API_HOST: 0.0.0.0
    ports:
      - "${TICKET_API_PORT:-8000}:8000"

  train-ml:
    <<: *ticket-service
    entrypoint: ["python", "-m", "ticket_automation.training"]
    command: ["train"]
    environment:
      TICKET_MODEL_PATH: /runtime/models/intent-classifier.joblib
      TICKET_CLASSIFIER_MODEL: /runtime/models/intent-classifier.joblib
      TICKET_ML_REPORT_PATH: /runtime/ml/evaluation.json

  demo-ml:
    <<: *ticket-service
    command:
      - "demo"
      - "--classifier"
      - "ml"
      - "--classifier-model"
      - "/runtime/models/intent-classifier.joblib"
      - "--rollout-config"
      - "/app/config/rollout.auto-demo.json"

volumes:
  ticket-runtime:
