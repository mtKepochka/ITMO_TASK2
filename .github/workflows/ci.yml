name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for Mermaid validation
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Check repository hygiene
        run: |
          git diff --check
          if git ls-files | grep -Ei 'talent[ _-]*track|Talent Track\.html'; then
            echo "Local task reference must not be tracked" >&2
            exit 1
          fi
          test -z "$(git ls-files 'artifacts/*')"

      - name: Run unit and scenario tests
        run: make test

      - name: Run ticket PoC
        run: |
          make demo-rules
          make smoke

      - name: Train and exercise ML classifier
        run: |
          make demo
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/ml/evaluation.json").read_text(encoding="utf-8")
          )
          assert report["train_examples"] == 56
          assert report["test_examples"] == 21
          assert 0.0 <= report["macro_f1"] <= 1.0
          assert len(report["confusion_matrix"]) == 7
          assert report["coverage"] >= 0.3
          assert report["covered_accuracy"] >= 0.9
          PY

      - name: Check semantic offline fallback
        run: |
          python -m ticket_automation.cli process \
            --text "Приложение не открывается. Это общий сбой?" \
            --classifier ml \
            --classifier-model artifacts/models/intent-classifier.joblib \
            --retriever e5 \
            --semantic-offline \
            --embedding-cache /tmp/ticket-embedding-cache \
            --audit /tmp/semantic-fallback-audit.jsonl \
            > /tmp/semantic-fallback.json \
            2> /tmp/semantic-fallback.err
          grep -q 'using lexical fallback' /tmp/semantic-fallback.err
          grep -q '"source": "lexical"' /tmp/semantic-fallback.json
          grep -q '"fallback_used": true' /tmp/semantic-fallback.json

      - name: Run concurrent pipeline benchmark
        run: |
          python -m ticket_automation.benchmark \
            --tickets 200 --concurrency 20 > /tmp/benchmark.json
          python -m ticket_automation.benchmark \
            --tickets 200 --concurrency 20 --failure-every 10 \
            > /tmp/benchmark-fault.json
          python - <<'PY'
          import json
          from pathlib import Path

          regular = json.loads(Path("/tmp/benchmark.json").read_text())
          fault = json.loads(Path("/tmp/benchmark-fault.json").read_text())
          assert regular["completed"] == 200
          assert regular["exceptions"] == 0
          assert regular["unsafe_auto_replies"] == 0
          assert fault["technical_fallbacks"] == 20
          assert fault["unsafe_auto_replies"] == 0
          PY

      - name: Build deployment image
        run: |
          version="$(PYTHONPATH=src python -c \
            'import ticket_automation; print(ticket_automation.__version__)')"
          docker build \
            --build-arg APP_VERSION="$version" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "ticket-automation:$version" \
            .
          test "$(docker run --rm "ticket-automation:$version" --version)" = \
            "ticket-automation $version"
          docker run --rm "ticket-automation:$version" demo > /tmp/container-demo.out
          grep -q '"action": "suggest_to_agent"' /tmp/container-demo.out
          docker run --rm "ticket-automation:$version" demo \
            --rollout-config /app/config/rollout.auto-demo.json \
            > /tmp/container-auto-demo.out
          grep -q '"action": "auto_reply"' /tmp/container-auto-demo.out
          TICKET_TAG="$version-${GITHUB_SHA::12}" \
            TICKET_VERSION="$version" docker compose config --quiet

      - name: Run queueing scenarios
        run: |
          make simulate
          make simulate-burst
          make simulate-compare

      - name: Check deterministic reports and invariants
        run: |
          python -m simulation.cli baseline --seed 42 --output /tmp/baseline-1.json
          python -m simulation.cli baseline --seed 42 --output /tmp/baseline-2.json
          diff -u /tmp/baseline-1.json /tmp/baseline-2.json
          python scripts/check_simulation_report.py \
            /tmp/baseline-1.json \
            artifacts/simulation/baseline.json \
            artifacts/simulation/burst.json \
            artifacts/simulation/compare.json

      - name: Render Mermaid diagram
        run: |
          awk '
            /^```mermaid$/ { inside = 1; next }
            inside && /^```$/ { exit }
            inside { print }
          ' docs/queueing-model.md > /tmp/ticket-system.mmd
          test -s /tmp/ticket-system.mmd
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$chrome_path"
          export PUPPETEER_EXECUTABLE_PATH="$chrome_path"
          "$chrome_path" --version
          npx --yes @mermaid-js/mermaid-cli@11.16.0 \
            --input /tmp/ticket-system.mmd \
            --output artifacts/simulation/ticket-system.svg \
            --backgroundColor transparent

      - name: Ensure tracked files stayed unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports-${{ github.sha }}
          path: |
            artifacts/ml/evaluation.json
            artifacts/simulation/*.json
            artifacts/simulation/ticket-system.svg
          retention-days: 7
