[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-automation-poc"
version = "0.1.0"
description = "Local PoC for safe support ticket routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5,<2",
    "simpy>=4.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
ticket-automation = "ticket_automation.cli:main"
ticket-simulation = "simulation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
